<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>2048 Game | Rahul Sharma</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- Game Header -->
        <header class="game-header">

            <h1>2048</h1>

            <div class="score-box">
                Score:
                <span id="score">0</span>
            </div>

        </header>


        <!-- Game Board -->
        <section class="board" aria-label="2048 game board">

            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>

            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>

            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>

            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>

        </section>


        <!-- Restart Button -->
        <button id="restart">
            New Game
        </button>


        <!-- Instructions -->
        <p class="instructions">
            Use arrow keys or swipe to play.
        </p>


        <!-- Creator Identity -->
        <footer class="creator">

            <p>
                Created by
                <strong>Rahul Sharma</strong>
            </p>

            <span>
                B.Tech CSE • Web Development Project
            </span>

        </footer>

    </main>


    <script src="app.js"></script>

</body>

</html>
